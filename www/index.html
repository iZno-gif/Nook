  <style>

    /* Smooth Pinterest-style folder-tab card with curved inner fillet */
    .folder-tab {
      position: relative;
      border-radius: 0 24px 24px 24px;
      margin-top: 16px;
    }
    .folder-tab::before {
      content: '';
      position: absolute;
      top: -16px;
      left: 0;
      width: 46%;
      height: 18px;
      background: inherit;
      border-radius: 16px 20px 0 0;
    }
    .folder-tab::after {
      content: '';
      position: absolute;
      top: -12px;
      left: 44%;
      width: 14px;
      height: 14px;
      background: transparent;
      border-bottom-left-radius: 14px;
      box-shadow: -6px 6px 0 0 var(--tab-color, #DCF859);
      pointer-events: none;
    }
    /* Stacked layered folder effect from Pinterest Image 1 */

      position: relative;
      padding-top: 34px;
    }
    .folder-layer-back {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 60px;
      border-radius: 0 24px 0 0;
    }
    .folder-layer-back::before {
      content: '';
      position: absolute;
      top: -14px;
      left: 0;
      width: 40%;
      height: 16px;
      background: inherit;
      border-radius: 16px 20px 0 0;
    }
    .folder-layer-mid {
      position: absolute;
      top: 16px;
      left: 0;
      right: 0;
      height: 60px;
      border-radius: 0 24px 0 0;
    }
    .folder-layer-mid::before {

      position: absolute;
      top: -14px;
      left: 0;
      width: 43%;
      height: 16px;
      background: inherit;
      border-radius: 16px 20px 0 0;
    }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    @keyframes viewSlideRight {
      from { opacity: 0; transform: translateX(18px) scale(0.99); }
      to { opacity: 1; transform: translateX(0) scale(1); }
    }
    @keyframes viewSlideLeft {
      from { opacity: 0; transform: translateX(-18px) scale(0.99); }
      to { opacity: 1; transform: translateX(0) scale(1); }
    }
    @keyframes pillPop {
      0% { transform: scale(0.88); }
      65% { transform: scale(1.06); }
      100% { transform: scale(1); }
    }
    .anim-slide-right { animation: viewSlideRight 0.24s cubic-bezier(0.22, 1, 0.36, 1) both; }
    .anim-slide-left { animation: viewSlideLeft 0.24s cubic-bezier(0.22, 1, 0.36, 1) both; }

    .nav-tab:hover { transform: translateY(-2px); }
    .nav-tab-active { animation: pillPop 0.28s cubic-bezier(0.34, 1.56, 0.64, 1) both; }

      function getTodayStr(offsetDays = 0) {
        const d = new Date();
        d.setDate(d.getDate() + offsetDays);
        const y = d.getFullYear();
        const m = String(d.getMonth() + 1).padStart(2, '0');
        const day = String(d.getDate()).padStart(2, '0');
        return `${y}-${m}-${day}`;
      }

      function formatDisplayDate(dateStr) {
        if (!dateStr || !/^\d{4}-\d{2}-\d{2}$/.test(dateStr)) return dateStr || '';
        const [y, m, d] = dateStr.split('-').map(Number);
        const dt = new Date(y, m - 1, d);
        return dt.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });
      }

      function formatShortDate(dateStr) {
        if (!dateStr || !/^\d{4}-\d{2}-\d{2}$/.test(dateStr)) return dateStr || '';
        const [y, m, d] = dateStr.split('-').map(Number);
        const dt = new Date(y, m - 1, d);
        return dt.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
      }

      function getDayOfWeek(dateStr) {
        const [y, m, d] = dateStr.split('-').map(Number);
        return new Date(y, m - 1, d).getDay();

      function loadState() {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          if (raw) {
            const parsed = JSON.parse(raw);
            return Object.assign(createDefaultState(), parsed);
          }
        } catch (e) {}
        return createDefaultState();
      }

      function getLocalNotificationsPlugin() {
        return window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.LocalNotifications
          ? window.Capacitor.Plugins.LocalNotifications
          : null;
      }

      async function syncOfflineNotifications() {
        const LN = getLocalNotificationsPlugin();
        if (!LN) return;
        try {
          const perm = await LN.checkPermissions();
          if (perm.display !== 'granted') {
            await LN.requestPermissions();
          }
          const pending = await LN.getPending();
          if (pending && pending.notifications && pending.notifications.length) {
            await LN.cancel({ notifications: pending.notifications.map(n => ({ id: n.id })) });
          }

          const toSchedule = [];
          let nid = 100;
          const now = new Date();

          // 1. Schedule 9:00 AM reminders for upcoming Project/Task deadlines & Calendar Markings
          const calMap = getCalendarItemsMap();
          Object.keys(calMap).forEach(dateStr => {
            const [y, m, d] = dateStr.split('-').map(Number);
            const fireAt = new Date(y, m - 1, d, 9, 0, 0);
            if (fireAt > now) {
              calMap[dateStr].filter(it => !it.done).forEach(it => {
                toSchedule.push({
                  id: nid++,
                  title: `Nook ${it.type}: ${it.title}`,
                  body: `Scheduled for today (${dateStr})`,
                  schedule: { at: fireAt, allowWhileIdle: true }
                });
              });
            }
          });

          // 2. Schedule 8:00 PM weekly repeating reminders for each Habit's scheduledDays
          state.habits.forEach(h => {
            const days = h.scheduledDays && h.scheduledDays.length ? h.scheduledDays : [0,1,2,3,4,5,6];
            days.forEach(jsDay => {
              // Capacitor weekday: 1 = Sunday .. 7 = Saturday
              const capWeekday = jsDay + 1;
              toSchedule.push({
                id: nid++,
                title: `Habit Reminder: ${h.emoji} ${h.name}`,
                body: `Tap to check off today's habit in Nook.`,
                schedule: { on: { weekday: capWeekday, hour: 20, minute: 0 }, allowWhileIdle: true }
              });
            });
          });

          if (toSchedule.length > 0) {
            await LN.schedule({ notifications: toSchedule.slice(0, 60) });
          }
        } catch (err) {}
      }

      function saveState() {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
        } catch (e) {}
        syncOfflineNotifications();
      }

      let state = loadState();
      let restInterval = null;
      const TAB_ORDER = ['today', 'daily', 'notes', 'workout', 'projects', 'study', 'habits', 'calendar'];
      let lastRenderedTab = state.activeTab;

      function applyTheme() {
        const html = document.documentElement;
        if (state.theme === 'dark') html.classList.add('dark');
        else html.classList.remove('dark');
      }

      function showToast(msg) {
        const container = document.getElementById('toast-container');
        const el = document.createElement('div');
        el.className = 'px-4 py-2 rounded-full bg-[#DCF859] text-black text-xs font-bold shadow-xl pointer-events-auto transition-opacity duration-200';
        el.textContent = msg;
        container.appendChild(el);
        setTimeout(() => {
          el.style.opacity = '0';
          setTimeout(() => el.remove(), 220);
        }, 2200);
      }

      function fireConfetti() {
        if (typeof window.confetti === 'function') {
          window.confetti({
            particleCount: 55,
            spread: 65,
            origin: { y: 0.7 },
            colors: ['#DCF859', '#7DF46C', '#FF7556', '#34D5C7']
          });
        }
      }

      function runDailyRefreshCheck(forceNewDay = false) {
        const today = getTodayStr(0);
        if (forceNewDay || (state.lastDailyDate && state.lastDailyDate !== today)) {
          const completed = state.dailyTasks.filter(t => t.done).map(t => t.text);
          if (completed.length > 0) {
            state.yesterdayArchive = completed;
          }
          const nextTasks = [];
          state.dailyTasks.forEach(t => {
            if (t.recurring) {
              nextTasks.push({ ...t, done: false });
            } else if (!t.done && state.carryOverUnfinished) {
              nextTasks.push(t);
            }
          });
          state.dailyTasks = nextTasks;
          state.lastDailyDate = today;
          saveState();
          if (forceNewDay) showToast('Daily To-Do refreshed for a new day');
        }
      }

      function escapeHtml(str) {
        return String(str ?? '')
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;');
      }

      function isHabitScheduledOn(habit, dateStr) {
        const days = habit.scheduledDays && habit.scheduledDays.length ? habit.scheduledDays : [0, 1, 2, 3, 4, 5, 6];
        return days.includes(getDayOfWeek(dateStr));
      }

      function formatHabitSchedule(habit) {
        const days = habit.scheduledDays && habit.scheduledDays.length ? habit.scheduledDays : [0, 1, 2, 3, 4, 5, 6];
        if (days.length === 7) return 'Every day';
        if (days.length === 1) return DAY_NAMES[days[0]];
        return days.slice().sort((a, b) => a - b).map(d => DAY_NAMES[d]).join(', ');
      }

      function getHabitStreak(habit) {
        let streak = 0;
        const today = getTodayStr(0);
        for (let offset = 0; offset >= -60; offset--) {
          const d = getTodayStr(offset);
          const scheduled = isHabitScheduledOn(habit, d);
          const done = !!habit.history[d];
          if (done) {
            streak++;
          } else if (scheduled && d !== today) {
            break;
          }
        }
        return streak;
      }

      function getLast7Days() {
        const days = [];
        for (let i = -6; i <= 0; i++) {
          const dateStr = getTodayStr(i);
          const [y, m, d] = dateStr.split('-').map(Number);
          const dt = new Date(y, m - 1, d);
          days.push({
            dateStr,
            shortDay: dt.toLocaleDateString('en-US', { weekday: 'narrow' }),
            isToday: i === 0
          });
        }
        return days;
      }

      function getCalendarItemsMap() {
        const map = {};
        function pushItem(dateStr, item) {
          if (!dateStr || !/^\d{4}-\d{2}-\d{2}$/.test(dateStr)) return;
          if (!map[dateStr]) map[dateStr] = [];
          map[dateStr].push(item);
        }

        state.projects.forEach(p => {
          if (p.due) {
            pushItem(p.due, {
              id: 'proj-' + p.id,
              title: `Project: ${p.title}`,
              type: 'Project',
              done: p.status === 'Done',
              source: 'project'
            });
          }
          p.tasks.forEach(t => {
            if (t.due) {
              pushItem(t.due, {
                id: 'ptask-' + t.id,
                title: `${t.text} (${p.title})`,
                type: 'Task Due',
                done: t.done,
                source: 'task'
              });
            }
          });
        });

        (state.calendarEvents || []).forEach(ev => {
          pushItem(ev.date, {
            id: ev.id,
            title: ev.title,
            type: ev.type || 'Important',
            done: false,
            source: 'custom'
          });
        });

        return map;
      }

                  <option value="normal">Normal</option>
                  <option value="high">High Priority</option>

                  <input type="checkbox" id="daily-input-recurring" class="accent-black rounded" />
                  <span>Daily</span>
                </label>
                <button type="submit" class="px-5 py-2 rounded-full bg-[#34D5C7] text-black text-sm font-bold">Add</button>
              </div>
            </form>

            <div class="flex items-center justify-between gap-3">
              <div class="flex items-center gap-1.5">
                ${['all', 'pending', 'done'].map(f => `
                  <button data-action="set-daily-filter" data-filter="${f}" class="px-3.5 py-1 rounded-full text-xs font-bold capitalize transition-colors ${state.dailyFilter === f ? 'bg-[#34D5C7] text-black' : 'bg-[#FFFDF7] dark:bg-[#141416] border border-stone-200 dark:border-zinc-800 text-zinc-400'}">${f}</button>

                <div class="flex items-center justify-between gap-3 px-4 py-3 hover:bg-[#F3F0E6] dark:hover:bg-zinc-900/60">
                  <label class="flex items-center gap-3 flex-1 cursor-pointer min-w-0">
                    <input type="checkbox" data-action="toggle-daily" data-id="${t.id}" ${t.done ? 'checked' : ''} class="w-4 h-4 accent-[#34D5C7] cursor-pointer shrink-0" />

                    </button>
                  </div>
                </div>
              `).join('')}
            </div>

            ${state.yesterdayArchive.length > 0 ? `
              <div class="p-4 rounded-3xl bg-[#7DF46C] text-black">
                <div class="text-xs font-bold mb-2">Completed in Previous Cycle</div>
                <ul class="space-y-1 text-xs font-medium list-disc list-inside">
                  ${state.yesterdayArchive.map(item => `<li>${escapeHtml(item)}</li>`).join('')}
                </ul>
              </div>

          </div>

      }

      function renderNotesView() {
        const tags = ['All', 'Idea', 'Reference', 'Quick'];
        const q = state.notesSearch.trim().toLowerCase();
        const filtered = state.notes
          .filter(n => state.notesFilter === 'All' || n.tag === state.notesFilter)
          .filter(n => !q || n.title.toLowerCase().includes(q) || n.body.toLowerCase().includes(q))
          .sort((a, b) => (b.pinned ? 1 : 0) - (a.pinned ? 1 : 0));

        return `
          <div class="space-y-5">
            <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3">
              <div>
                <h1 class="text-2xl font-display font-extrabold tracking-tight text-[#DCF859]">Quick Notes</h1>
                <p class="text-xs text-slate-500 dark:text-zinc-400 mt-0.5">Instant capture with zero folder nesting.</p>
              </div>
              <div class="relative">
                <i data-lucide="search" class="w-3.5 h-3.5 text-zinc-400 absolute left-3.5 top-1/2 -translate-y-1/2"></i>
                <input type="text" id="notes-search-input" value="${escapeHtml(state.notesSearch)}" placeholder="Search notes..." class="pl-9 pr-4 py-1.5 rounded-full text-sm bg-[#FFFDF7] dark:bg-[#141416] border border-stone-200 dark:border-zinc-800 focus:outline-none focus:border-[#DCF859] w-48 sm:w-56" />
              </div>
            </div>

            <form id="note-add-form" class="p-4 rounded-3xl bg-[#FFFDF7] dark:bg-[#141416] border border-stone-200 dark:border-zinc-800 space-y-2.5">
              <div class="flex flex-col sm:flex-row gap-2">
                <input type="text" id="note-title-input" placeholder="Note title (optional)" class="flex-1 px-4 py-2 rounded-full text-sm font-semibold bg-[#EFECE2] dark:bg-zinc-900 border border-stone-200 dark:border-zinc-800 focus:outline-none" />
                <select id="note-tag-input" class="px-4 py-2 rounded-full text-sm font-semibold bg-[#EFECE2] dark:bg-zinc-900 border border-stone-200 dark:border-zinc-800">
                  <option value="Quick">Quick</option>
                  <option value="Idea">Idea</option>
                  <option value="Reference">Reference</option>
                </select>
              </div>
              <textarea id="note-body-input" rows="3" required placeholder="Write your note..." class="w-full px-4 py-2.5 rounded-2xl text-sm bg-[#EFECE2] dark:bg-zinc-900 border border-stone-200 dark:border-zinc-800 focus:outline-none resize-y"></textarea>
              <div class="flex justify-end">
                <button type="submit" class="px-5 py-2 rounded-full bg-[#DCF859] text-black text-sm font-bold">Save Note</button>
              </div>
            </form>

            <div class="flex items-center gap-2 flex-wrap">
              ${tags.map(t => `
                <button data-action="set-note-filter" data-tag="${t}" class="px-3.5 py-1 rounded-full text-xs font-bold ${state.notesFilter === t ? 'bg-[#DCF859] text-black' : 'bg-[#FFFDF7] dark:bg-[#141416] border border-stone-200 dark:border-zinc-800 text-zinc-400'}">${t}</button>
              `).join('')}
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4 pt-2">
              ${filtered.length === 0 ? `<div class="col-span-full p-8 text-center text-sm bg-[#FFFDF7] dark:bg-[#141416] rounded-3xl border border-zinc-800">No matching notes.</div>` : filtered.map(n => `
                <article style="--tab-color:#DCF859" class="${n.pinned ? 'folder-tab bg-[#DCF859] text-black' : 'rounded-3xl bg-[#FFFDF7] dark:bg-[#141416] border border-stone-200 dark:border-zinc-800'} p-4 flex flex-col justify-between gap-3">
                  <div>
                    <div class="flex items-start justify-between gap-2 mb-2">
                      <h3 class="font-display font-bold text-base">${escapeHtml(n.title || 'Untitled Note')}</h3>
                      <span class="text-[11px] px-2.5 py-0.5 rounded-full ${n.pinned ? 'bg-black text-[#DCF859]' : 'bg-zinc-800 text-zinc-200'} font-bold shrink-0">${escapeHtml(n.tag)}</span>
                    </div>
                    <p class="text-sm whitespace-pre-wrap leading-relaxed ${n.pinned ? 'text-black/85 font-medium' : 'text-slate-600 dark:text-zinc-300'}">${escapeHtml(n.body)}</p>
                  </div>
                  <div class="flex items-center justify-between pt-2.5 border-t ${n.pinned ? 'border-black/20' : 'border-stone-200 dark:border-zinc-800'} text-xs font-semibold">
                    <span>${escapeHtml(n.updatedAt)}</span>
                    <div class="flex items-center gap-1">
                      <button data-action="pin-note" data-id="${n.id}" title="Pin note" class="p-1.5 rounded-full ${n.pinned ? 'bg-black text-[#DCF859]' : 'hover:bg-zinc-800 text-zinc-400'}">
                        <i data-lucide="pin" class="w-3.5 h-3.5"></i>
                      </button>
                      <button data-action="copy-note" data-id="${n.id}" title="Copy text" class="p-1.5 rounded-full ${n.pinned ? 'hover:bg-black/10 text-black' : 'hover:bg-zinc-800 text-zinc-400'}">
                        <i data-lucide="copy" class="w-3.5 h-3.5"></i>
                      </button>
                      <button data-action="delete-note" data-id="${n.id}" title="Delete" class="p-1.5 rounded-full ${n.pinned ? 'hover:bg-black/10 text-black' : 'hover:bg-zinc-800 text-zinc-400 hover:text-[#FF7556]'}">
                        <i data-lucide="trash-2" class="w-3.5 h-3.5"></i>
                      </button>
                    </div>
                  </div>
                </article>
              `).join('')}
            </div>
          </div>
        `;
      }

      function renderWorkoutView() {
        const activeDay = state.workoutSplit.find(d => d.id === state.workoutActiveDayId) || state.workoutSplit[0];
        const mins = Math.floor(state.restSecondsLeft / 60);
        const secs = String(state.restSecondsLeft % 60).padStart(2, '0');

        return `
          <div class="space-y-5">
            <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3">
              <div>
                <h1 class="text-2xl font-display font-extrabold tracking-tight text-[#7DF46C]">Workout Tracker</h1>
                <p class="text-xs text-slate-500 dark:text-zinc-400 mt-0.5">Customize your split (add/remove days), log weights, and track sessions.</p>
              </div>
              <div class="flex items-center gap-1.5 bg-[#FFFDF7] dark:bg-[#141416] border border-stone-200 dark:border-zinc-800 px-3.5 py-1.5 rounded-full">
                <i data-lucide="timer" class="w-4 h-4 text-[#7DF46C]"></i>
                <span id="rest-timer-display" class="text-sm font-mono font-bold w-12 text-center">${mins}:${secs}</span>
                <button data-action="start-rest" data-sec="60" class="px-2.5 py-0.5 rounded-full text-xs font-bold bg-[#DCF859] text-black">60s</button>
                <button data-action="start-rest" data-sec="90" class="px-2.5 py-0.5 rounded-full text-xs font-bold bg-[#34D5C7] text-black">90s</button>
                <button data-action="start-rest" data-sec="120" class="px-2.5 py-0.5 rounded-full text-xs font-bold bg-[#7DF46C] text-black">2m</button>
                ${state.restSecondsLeft > 0 ? `<button data-action="stop-rest" class="px-2.5 py-0.5 rounded-full text-xs font-bold bg-[#FF7556] text-black">Reset</button>` : ''}
              </div>
            </div>

            <div class="space-y-3">
              <div class="flex items-center gap-2 overflow-x-auto no-scrollbar pb-1">
                ${state.workoutSplit.map(d => `
                  <div class="inline-flex items-center shrink-0">
                    <button data-action="select-workout-day" data-id="${d.id}" class="px-4 py-2 ${state.workoutSplit.length > 1 ? 'rounded-l-full' : 'rounded-full'} text-xs sm:text-sm font-bold whitespace-nowrap ${d.id === activeDay.id ? 'bg-[#7DF46C] text-black' : 'bg-[#FFFDF7] dark:bg-[#141416] border border-stone-200 dark:border-zinc-800 text-zinc-400'}">
                      ${escapeHtml(d.name)}
                    </button>
                    ${state.workoutSplit.length > 1 ? `
                      <button data-action="delete-workout-day" data-id="${d.id}" title="Remove day" class="px-2.5 py-2 rounded-r-full text-xs font-bold bg-[#FF7556] text-black">
                        ×
                      </button>
                    ` : ''}
                  </div>
                `).join('')}
                <button data-action="toggle-add-workout-day" class="px-3.5 py-2 rounded-full text-xs font-bold bg-[#DCF859] text-black whitespace-nowrap shrink-0 flex items-center gap-1">
                  <i data-lucide="plus" class="w-3.5 h-3.5"></i> Add Day
                </button>
              </div>

              ${state.showAddWorkoutDay ? `
                <form id="add-workout-day-form" class="p-3 rounded-2xl bg-[#FFFDF7] dark:bg-[#141416] border border-zinc-800 flex flex-col sm:flex-row gap-2">
                  <input type="text" id="new-workout-day-name" placeholder="e.g. Day ${state.workoutSplit.length + 1} — Arms & Conditioning" required class="flex-1 px-4 py-1.5 rounded-full text-sm bg-[#EFECE2] dark:bg-zinc-900 border border-zinc-800 focus:outline-none" />
                  <div class="flex gap-2">
                    <button type="submit" class="px-4 py-1.5 rounded-full bg-[#7DF46C] text-black text-xs font-bold">Create Day</button>
                    <button type="button" data-action="toggle-add-workout-day" class="px-3 py-1.5 rounded-full bg-zinc-800 text-zinc-300 text-xs font-bold">Cancel</button>
                  </div>
                </form>
              ` : ''}
            </div>

            <div class="grid grid-cols-1 lg:grid-cols-12 gap-5">
              <div class="lg:col-span-8 space-y-4">
                <div class="rounded-3xl bg-[#FFFDF7] dark:bg-[#141416] border border-stone-200 dark:border-zinc-800 overflow-hidden">
                  <div class="px-4 py-3 border-b border-stone-200 dark:border-zinc-800 flex items-center justify-between gap-2">
                    <span class="font-display font-bold text-sm">${escapeHtml(activeDay.name)}</span>
                    <button data-action="finish-workout" class="px-4 py-1.5 rounded-full bg-[#7DF46C] text-black text-xs font-bold flex items-center gap-1.5 shrink-0">
                      <i data-lucide="check-circle-2" class="w-3.5 h-3.5"></i> Finish &amp; Log Session
                    </button>
                  </div>
                  <div class="divide-y divide-slate-200 dark:divide-zinc-800">
                    ${activeDay.exercises.length === 0 ? `<div class="p-6 text-center text-xs text-zinc-500">No exercises added for this day yet.</div>` : activeDay.exercises.map(ex => `
                      <div class="p-3.5 flex flex-col sm:flex-row sm:items-center justify-between gap-3">
                        <label class="flex items-center gap-3 cursor-pointer flex-1 min-w-0">
                          <input type="checkbox" data-action="toggle-exercise" data-day="${activeDay.id}" data-id="${ex.id}" ${ex.done ? 'checked' : ''} class="w-4 h-4 accent-[#7DF46C] cursor-pointer shrink-0" />
                          <span class="text-sm font-semibold ${ex.done ? 'line-through opacity-45' : ''}">${escapeHtml(ex.name)}</span>
                        </label>
                        <div class="flex items-center gap-2 text-xs">
                          <label class="flex items-center gap-1 text-zinc-400">
                            <span>Sets</span>
                            <input type="number" min="1" max="10" data-action="edit-ex" data-field="sets" data-day="${activeDay.id}" data-id="${ex.id}" value="${escapeHtml(ex.sets)}" class="w-12 px-2 py-1 rounded-xl bg-[#EFECE2] dark:bg-zinc-900 border border-zinc-800 text-center font-mono text-slate-900 dark:text-white" />
                          </label>
                          <label class="flex items-center gap-1 text-zinc-400">
                            <span>Reps</span>
                            <input type="text" data-action="edit-ex" data-field="reps" data-day="${activeDay.id}" data-id="${ex.id}" value="${escapeHtml(ex.reps)}" class="w-14 px-2 py-1 rounded-xl bg-[#EFECE2] dark:bg-zinc-900 border border-zinc-800 text-center font-mono text-slate-900 dark:text-white" />
                          </label>
                          <label class="flex items-center gap-1 text-zinc-400">
                            <span>kg</span>
                            <input type="text" data-action="edit-ex" data-field="weight" data-day="${activeDay.id}" data-id="${ex.id}" value="${escapeHtml(ex.weight)}" class="w-14 px-2 py-1 rounded-xl bg-[#EFECE2] dark:bg-zinc-900 border border-zinc-800 text-center font-mono text-slate-900 dark:text-white" />
                          </label>
                          <button data-action="delete-exercise" data-day="${activeDay.id}" data-id="${ex.id}" class="p-1.5 rounded-full text-zinc-400 hover:text-[#FF7556]">
                            <i data-lucide="trash-2" class="w-3.5 h-3.5"></i>
                          </button>
                        </div>
                      </div>
                    `).join('')}
                  </div>
                  <form id="add-exercise-form" data-day="${activeDay.id}" class="p-3 bg-[#F3F0E6] dark:bg-zinc-900/60 border-t border-stone-200 dark:border-zinc-800 flex flex-wrap gap-2">
                    <input type="text" id="ex-name-input" placeholder="Add exercise..." required class="flex-1 min-w-[150px] px-3.5 py-1.5 rounded-full text-sm bg-[#FFFDF7] dark:bg-[#141416] border border-zinc-800 focus:outline-none" />
                    <input type="number" id="ex-sets-input" placeholder="Sets" value="3" min="1" class="w-16 px-2.5 py-1.5 rounded-full text-sm bg-[#FFFDF7] dark:bg-[#141416] border border-zinc-800 font-mono text-center" />
                    <input type="text" id="ex-reps-input" placeholder="Reps" value="10-12" class="w-20 px-2.5 py-1.5 rounded-full text-sm bg-[#FFFDF7] dark:bg-[#141416] border border-zinc-800 font-mono text-center" />
                    <input type="text" id="ex-weight-input" placeholder="kg" value="20" class="w-16 px-2.5 py-1.5 rounded-full text-sm bg-[#FFFDF7] dark:bg-[#141416] border border-zinc-800 font-mono text-center" />
                    <button type="submit" class="px-4 py-1.5 rounded-full bg-[#7DF46C] text-black text-sm font-bold">Add</button>
                  </form>
                </div>
              </div>

              <div class="lg:col-span-4">
                <div class="p-4 rounded-3xl bg-[#FFFDF7] dark:bg-[#141416] border border-stone-200 dark:border-zinc-800">
                  <h2 class="font-display font-bold text-sm mb-3 flex items-center gap-2">
                    <i data-lucide="history" class="w-4 h-4 text-[#7DF46C]"></i>
                    Recent Sessions
                  </h2>
                  <div class="space-y-2.5">
                    ${state.workoutLogs.length === 0 ? `<p class="text-xs text-zinc-500">No sessions logged yet.</p>` : state.workoutLogs.slice(0, 8).map(log => `
                      <div class="p-3 rounded-2xl bg-[#EFECE2] dark:bg-zinc-900 border border-zinc-800/80">
                        <div class="flex items-center justify-between text-xs font-bold">
                          <span>${escapeHtml(log.dayName)}</span>
                          <span class="px-2 py-0.5 rounded-full bg-[#7DF46C] text-black font-mono">${formatDisplayDate(log.date)}</span>
                        </div>
                        <div class="text-xs font-mono text-zinc-400 mt-1">
                          ${log.completedExercises} exercises · ~${log.totalVolume.toLocaleString()} kg
                        </div>
                      </div>
                    `).join('')}
                  </div>
                </div>
              </div>
            </div>
          </div>
        `;
      }

      function renderProjectsView() {
        return `
          <div class="space-y-5">
            <div>
              <h1 class="text-2xl font-display font-extrabold tracking-tight text-[#34D5C7]">Ongoing Projects</h1>
              <p class="text-xs text-slate-500 dark:text-zinc-400 mt-0.5">Track projects and target dates for every underlying task (synced with Calendar).</p>

            <form id="project-add-form" class="p-4 rounded-3xl bg-[#FFFDF7] dark:bg-[#141416] border border-stone-200 dark:border-zinc-800 flex flex-col sm:flex-row gap-2.5">
              <input type="text" id="project-title-input" placeholder="New project name..." required class="flex-1 px-4 py-2 rounded-full text-sm bg-[#EFECE2] dark:bg-zinc-900 border border-zinc-800 focus:outline-none" />
              <input type="date" id="project-due-input" title="Project target date" class="sm:w-44 px-4 py-2 rounded-full text-sm bg-[#EFECE2] dark:bg-zinc-900 border border-zinc-800" />
              <button type="submit" class="px-5 py-2 rounded-full bg-[#34D5C7] text-black text-sm font-bold">Create Project</button>
            </form>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
              ${state.projects.map(p => {
                const done = p.tasks.filter(t => t.done).length;
                const total = p.tasks.length;
                const pct = total ? Math.round((done / total) * 100) : 0;
                return `
                  <div class="p-5 rounded-3xl bg-[#FFFDF7] dark:bg-[#141416] border border-stone-200 dark:border-zinc-800 flex flex-col justify-between gap-4">
                    <div>
                      <div class="flex items-start justify-between gap-2 mb-2">
                        <div>
                          <h3 class="font-display font-bold text-base">${escapeHtml(p.title)}</h3>
                          <div class="flex items-center gap-2 mt-1.5 text-xs flex-wrap">
                            <select data-action="change-project-status" data-id="${p.id}" class="px-2.5 py-0.5 rounded-full bg-[#DCF859] text-black text-xs font-bold">
                              ${['Active', 'On Hold', 'Done'].map(s => `<option value="${s}" ${p.status === s ? 'selected' : ''}>${s}</option>`).join('')}
                            </select>
                            ${p.due ? `<span class="font-mono text-zinc-400">Due: ${formatShortDate(p.due)}</span>` : ''}
                          </div>
                        </div>
                        <button data-action="delete-project" data-id="${p.id}" class="p-1.5 rounded-full text-zinc-400 hover:text-[#FF7556]">
                          <i data-lucide="trash-2" class="w-4 h-4"></i>
                        </button>
                      </div>

                      <div class="flex items-center gap-2 mb-3">

                        <span class="text-xs font-mono font-bold text-[#34D5C7]">${done}/${total}</span>
                      </div>

                      <div class="space-y-1.5 mb-3">
                        ${p.tasks.length === 0 ? `<p class="text-xs text-zinc-500">No tasks yet.</p>` : p.tasks.map(t => `
                          <div class="flex items-center justify-between gap-2 px-3 py-1.5 rounded-2xl bg-[#EFECE2] dark:bg-zinc-900 border border-zinc-800/70">
                            <label class="flex items-center gap-2.5 flex-1 cursor-pointer min-w-0">
                              <input type="checkbox" data-action="toggle-project-task" data-pid="${p.id}" data-tid="${t.id}" ${t.done ? 'checked' : ''} class="w-4 h-4 accent-[#34D5C7] cursor-pointer shrink-0" />

                              <button data-action="delete-project-task" data-pid="${p.id}" data-tid="${t.id}" class="p-1 text-zinc-400 hover:text-[#FF7556]">
                                <i data-lucide="x" class="w-3.5 h-3.5"></i>
                              </button>
                            </div>
                          </div>
                        `).join('')}
                      </div>

        return `

              <div>
                <h1 class="text-2xl font-display font-extrabold tracking-tight text-[#DCF859]">Study Roadmap (5–6 Months)</h1>

              ${[1, 2, 3, 4, 5, 6].map(m => `

      function renderCalendarView() {
        const calMap = getCalendarItemsMap();
        const year = state.calYear;
        const month = state.calMonth;
        const today = getTodayStr(0);
        const firstDay = new Date(year, month, 1).getDay();
        const daysInMonth = new Date(year, month + 1, 0).getDate();
        const monthLabel = new Date(year, month, 1).toLocaleDateString('en-US', { month: 'long', year: 'numeric' });

        let cells = '';
        for (let i = 0; i < firstDay; i++) {
          cells += `<div class="min-h-[82px] rounded-2xl bg-slate-100/50 dark:bg-zinc-900/30"></div>`;
        }
        for (let d = 1; d <= daysInMonth; d++) {
          const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
          const items = calMap[dateStr] || [];
          const isToday = dateStr === today;
          const isSel = dateStr === state.calSelectedDate;

          cells += `
            <button data-action="select-cal-date" data-date="${dateStr}" class="min-h-[82px] p-2 rounded-2xl border text-left flex flex-col justify-between transition-all ${isSel ? 'border-[#DCF859] bg-[#DCF859]/15' : isToday ? 'border-[#34D5C7] bg-[#34D5C7]/10' : 'border-stone-200 dark:border-zinc-800 bg-[#FFFDF7] dark:bg-zinc-900/70 hover:border-zinc-600'}">
              <div class="flex items-center justify-between w-full">
                <span class="text-xs font-mono font-bold ${isToday ? 'px-1.5 py-0.5 rounded-full bg-[#34D5C7] text-black' : ''}">${d}</span>
                ${items.length ? `<span class="text-[10px] font-mono font-bold px-1.5 rounded-full bg-zinc-800 text-[#DCF859]">${items.length}</span>` : ''}
              </div>
              <div class="space-y-1 w-full mt-1">
                ${items.slice(0, 2).map(it => {
                  const badgeColor = it.type === 'Deadline' || it.type === 'Task Due' ? 'bg-[#FF7556] text-black' : it.type === 'Project' ? 'bg-[#34D5C7] text-black' : 'bg-[#DCF859] text-black';
                  return `<div class="text-[10px] font-bold px-1.5 py-0.5 rounded-md truncate ${badgeColor}">${escapeHtml(it.title)}</div>`;
                }).join('')}
                ${items.length > 2 ? `<div class="text-[10px] font-bold text-zinc-400">+${items.length - 2} more</div>` : ''}
              </div>
            </button>
          `;
        }

        const selectedItems = calMap[state.calSelectedDate] || [];

        return `
          <div class="space-y-5">
            <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3">
              <div>
                <h1 class="text-2xl font-display font-extrabold tracking-tight text-[#34D5C7]">Calendar &amp; Deadlines</h1>
                <p class="text-xs text-slate-500 dark:text-zinc-400 mt-0.5">Automatically displays Project deadlines, Task target dates, and your Important markings.</p>
              </div>
              <div class="flex items-center gap-2">
                <button data-action="cal-prev" class="px-3 py-1.5 rounded-full bg-[#FFFDF7] dark:bg-[#141416] border border-zinc-800 text-xs font-bold">← Prev</button>
                <button data-action="cal-today" class="px-3.5 py-1.5 rounded-full bg-[#DCF859] text-black text-xs font-bold">Today</button>
                <button data-action="cal-next" class="px-3 py-1.5 rounded-full bg-[#FFFDF7] dark:bg-[#141416] border border-zinc-800 text-xs font-bold">Next →</button>
              </div>
            </div>

            <div class="grid grid-cols-1 lg:grid-cols-12 gap-5">
              <div class="lg:col-span-8 p-4 sm:p-5 rounded-3xl bg-[#FFFDF7] dark:bg-[#141416] border border-stone-200 dark:border-zinc-800">
                <div class="flex items-center justify-between mb-3">
                  <h2 class="font-display font-bold text-lg">${escapeHtml(monthLabel)}</h2>
                  <div class="flex items-center gap-2 text-[11px] font-bold">
                    <span class="px-2 py-0.5 rounded-full bg-[#FF7556] text-black">Deadline</span>
                    <span class="px-2 py-0.5 rounded-full bg-[#34D5C7] text-black">Project</span>
                    <span class="px-2 py-0.5 rounded-full bg-[#DCF859] text-black">Important</span>
                  </div>
                </div>
                <div class="grid grid-cols-7 gap-1.5 text-center text-xs font-mono font-bold text-zinc-500 mb-2">
                  ${DAY_NAMES.map(n => `<div>${n}</div>`).join('')}
                </div>
                <div class="grid grid-cols-7 gap-1.5">
                  ${cells}
                </div>
              </div>

              <div class="lg:col-span-4 space-y-4">
                <div class="p-5 rounded-3xl bg-[#FFFDF7] dark:bg-[#141416] border border-stone-200 dark:border-zinc-800">
                  <h3 class="font-display font-bold text-base mb-3">${formatDisplayDate(state.calSelectedDate)}</h3>
                  <div class="space-y-2 mb-4">
                    ${selectedItems.length === 0 ? `<p class="text-xs text-zinc-500">Nothing marked on this date yet.</p>` : selectedItems.map(it => `
                      <div class="p-2.5 rounded-2xl bg-[#EFECE2] dark:bg-zinc-900 border border-zinc-800 flex items-center justify-between gap-2">
                        <div class="min-w-0">
                          <div class="text-xs font-bold truncate ${it.done ? 'line-through opacity-45' : ''}">${escapeHtml(it.title)}</div>
                          <div class="text-[10px] font-mono text-zinc-400">${escapeHtml(it.type)}</div>
                        </div>
                        ${it.source === 'custom' ? `
                          <button data-action="delete-cal-event" data-id="${it.id}" class="p-1 rounded-full text-zinc-400 hover:text-[#FF7556] shrink-0">
                            <i data-lucide="trash-2" class="w-3.5 h-3.5"></i>
                          </button>
                        ` : ''}
                      </div>
                    `).join('')}
                  </div>

                  <form id="cal-add-event-form" class="pt-3 border-t border-stone-200 dark:border-zinc-800 space-y-2.5">
                    <div class="text-xs font-bold">Add Marking on ${formatShortDate(state.calSelectedDate)}</div>
                    <input type="text" id="cal-event-title" placeholder="Title (e.g. Exam, Movie Release)" required class="w-full px-3.5 py-2 rounded-full text-sm bg-[#EFECE2] dark:bg-zinc-900 border border-zinc-800 focus:outline-none" />
                    <div class="flex gap-2">
                      <select id="cal-event-type" class="flex-1 px-3 py-2 rounded-full text-xs font-bold bg-[#EFECE2] dark:bg-zinc-900 border border-zinc-800">
                        <option value="Important">Important</option>
                        <option value="Deadline">Deadline</option>
                        <option value="Event">Event</option>
                      </select>
                      <button type="submit" class="px-4 py-2 rounded-full bg-[#DCF859] text-black text-xs font-bold">Mark Date</button>
                    </div>
                  </form>
                </div>
              </div>
            </div>
          </div>
        `;
      }

      function render() {
        applyTheme();
        renderNav();
        const root = document.getElementById('app-root');
        const tabChanged = lastRenderedTab !== state.activeTab;
        const prevIdx = TAB_ORDER.indexOf(lastRenderedTab);
        const nextIdx = TAB_ORDER.indexOf(state.activeTab);
        lastRenderedTab = state.activeTab;
        if (tabChanged) {
          root.classList.remove('anim-slide-right', 'anim-slide-left');
          void root.offsetWidth;
          root.classList.add(nextIdx >= prevIdx ? 'anim-slide-right' : 'anim-slide-left');
        }
        switch (state.activeTab) {
          case 'today': root.innerHTML = renderTodayView(); break;
          case 'daily': root.innerHTML = renderDailyView(); break;
          case 'notes': root.innerHTML = renderNotesView(); break;
          case 'workout': root.innerHTML = renderWorkoutView(); break;
          case 'projects': root.innerHTML = renderProjectsView(); break;
          case 'study': root.innerHTML = renderStudyView(); break;
          case 'habits': root.innerHTML = renderHabitsView(); break;
          case 'calendar': root.innerHTML = renderCalendarView(); break;
          default: root.innerHTML = renderTodayView();
        }
        if (window.lucide) {
          lucide.createIcons();
        }
      }

      // --- EVENT HANDLERS ---

      document.getElementById('main-nav').addEventListener('click', (e) => {
        const btn = e.target.closest('[data-tab]');
        if (!btn) return;
        state.activeTab = btn.dataset.tab;
        saveState();
        render();
      });

      document.getElementById('header-deadlines-pill').addEventListener('click', () => {
        state.activeTab = 'calendar';
        saveState();
        render();
      });

      document.getElementById('theme-toggle').addEventListener('click', () => {
        state.theme = state.theme === 'dark' ? 'light' : 'dark';
        saveState();
        render();
      });

      const dataModal = document.getElementById('data-modal');
      document.getElementById('data-modal-btn').addEventListener('click', () => {
        dataModal.classList.remove('hidden');
        dataModal.classList.add('flex');
      });
      document.getElementById('close-data-modal').addEventListener('click', () => {
        dataModal.classList.add('hidden');
        dataModal.classList.remove('flex');
      });
      dataModal.addEventListener('click', (e) => {
        if (e.target === dataModal) {
          dataModal.classList.add('hidden');
          dataModal.classList.remove('flex');
        }
      });

      document.getElementById('btn-test-notif').addEventListener('click', async () => {
        const LN = getLocalNotificationsPlugin();
        if (LN) {
          try {
            await LN.requestPermissions();
            await LN.schedule({
              notifications: [{
                id: 9999,
                title: 'Nook Offline Reminder',
                body: 'Offline notifications are working on your device!',
                schedule: { at: new Date(Date.now() + 5000), allowWhileIdle: true }
              }]
            });
            showToast('Notification scheduled in 5s!');
          } catch (e) { showToast('Permission needed for notifications'); }
        } else {
          showToast('Offline APK notifications activate once installed on Android');
        }
      });

      document.getElementById('btn-export-json').addEventListener('click', () => {
        const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `nook-backup-${getTodayStr(0)}.json`;
        a.click();
        URL.revokeObjectURL(url);
        showToast('Backup exported');
      });

      document.getElementById('input-import-json').addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = () => {
          try {
            const imported = JSON.parse(reader.result);
            state = Object.assign(createDefaultState(), imported);
            saveState();
            render();
            dataModal.classList.add('hidden');
            dataModal.classList.remove('flex');
            showToast('Backup restored');
          } catch (err) {
            showToast('Invalid JSON file');
          }
        };
        reader.readAsText(file);
      });

      document.getElementById('btn-sim-new-day').addEventListener('click', () => {
        runDailyRefreshCheck(true);
        dataModal.classList.add('hidden');
        dataModal.classList.remove('flex');
        render();
      });

      document.getElementById('btn-reset-demo').addEventListener('click', () => {
        state = createDefaultState();
        saveState();
        dataModal.classList.add('hidden');
        dataModal.classList.remove('flex');
        render();
        showToast('Reset to sample data');
      });

      const appRoot = document.getElementById('app-root');

      appRoot.addEventListener('click', (e) => {
        const gotoBtn = e.target.closest('[data-goto]');
        if (gotoBtn) {
          state.activeTab = gotoBtn.dataset.goto;
          saveState();
          render();
          return;
        }

        const actionEl = e.target.closest('[data-action]');
        if (!actionEl) return;
        const action = actionEl.dataset.action;

        if (action === 'delete-daily') {
          state.dailyTasks = state.dailyTasks.filter(t => t.id !== actionEl.dataset.id);
          saveState(); render();
        } else if (action === 'set-daily-filter') {
          state.dailyFilter = actionEl.dataset.filter;
          saveState(); render();
        } else if (action === 'save-scratchpad-to-note') {
          const text = state.scratchpad.trim();
          if (!text) return showToast('Scratchpad is empty');
          state.notes.unshift({
            id: uid(),
            title: 'From Scratchpad',
            body: text,
            tag: 'Quick',
            pinned: false,
            updatedAt: 'Today'
          });
          state.scratchpad = '';
          saveState(); render();
          showToast('Saved to Notes');
        } else if (action === 'set-note-filter') {
          state.notesFilter = actionEl.dataset.tag;
          saveState(); render();
        } else if (action === 'pin-note') {
          const note = state.notes.find(n => n.id === actionEl.dataset.id);
          if (note) note.pinned = !note.pinned;
          saveState(); render();
        } else if (action === 'copy-note') {
          const note = state.notes.find(n => n.id === actionEl.dataset.id);
          if (note) {
            const fullText = (note.title ? note.title + '\n' : '') + note.body;
            if (navigator.clipboard && navigator.clipboard.writeText) {
              navigator.clipboard.writeText(fullText).catch(() => {});
            } else {
              const ta = document.createElement('textarea');
              ta.value = fullText;
              document.body.appendChild(ta);
              ta.select();
              try { document.execCommand('copy'); } catch (err) {}
              ta.remove();
            }
            showToast('Copied to clipboard');
          }
        } else if (action === 'delete-note') {
          state.notes = state.notes.filter(n => n.id !== actionEl.dataset.id);
          saveState(); render();
        } else if (action === 'select-workout-day') {
          state.workoutActiveDayId = actionEl.dataset.id;
          saveState(); render();
        } else if (action === 'toggle-add-workout-day') {
          state.showAddWorkoutDay = !state.showAddWorkoutDay;
          saveState(); render();
        } else if (action === 'delete-workout-day') {
          if (state.workoutSplit.length <= 1) return showToast('Keep at least 1 workout day');
          state.workoutSplit = state.workoutSplit.filter(d => d.id !== actionEl.dataset.id);
          if (state.workoutActiveDayId === actionEl.dataset.id) {
            state.workoutActiveDayId = state.workoutSplit[0].id;
          }
          saveState(); render();
          showToast('Workout day removed');
        } else if (action === 'delete-exercise') {
          const day = state.workoutSplit.find(d => d.id === actionEl.dataset.day);
          if (day) day.exercises = day.exercises.filter(ex => ex.id !== actionEl.dataset.id);
          saveState(); render();
        } else if (action === 'start-rest') {
          clearInterval(restInterval);
          state.restSecondsLeft = Number(actionEl.dataset.sec);
          render();
          restInterval = setInterval(() => {
            if (state.restSecondsLeft > 0) {
              state.restSecondsLeft--;
              const disp = document.getElementById('rest-timer-display');
              if (disp) {
                const m = Math.floor(state.restSecondsLeft / 60);
                const s = String(state.restSecondsLeft % 60).padStart(2, '0');
                disp.textContent = `${m}:${s}`;
              }
              if (state.restSecondsLeft === 0) {
                clearInterval(restInterval);
                showToast('Rest complete — next set!');
                render();
              }
            }
          }, 1000);
        } else if (action === 'stop-rest') {
          clearInterval(restInterval);
          state.restSecondsLeft = 0;
          render();
        } else if (action === 'finish-workout') {
          const day = state.workoutSplit.find(d => d.id === state.workoutActiveDayId);
          if (!day) return;
          const completed = day.exercises.filter(ex => ex.done);
          const list = completed.length ? completed : day.exercises;
          let volume = 0;
          list.forEach(ex => {
            const w = parseFloat(ex.weight) || 0;
            const r = parseInt(ex.reps, 10) || 10;
            volume += (ex.sets || 3) * r * w;
          });
          state.workoutLogs.unshift({
            id: uid(),
            date: getTodayStr(0),
            dayName: day.name,
            completedExercises: list.length,
            totalVolume: Math.round(volume)
          });
          day.exercises.forEach(ex => { ex.done = false; });
          saveState(); render();
          fireConfetti();
          showToast('Workout session logged!');
        } else if (action === 'delete-project') {
          state.projects = state.projects.filter(p => p.id !== actionEl.dataset.id);
          saveState(); render();
        } else if (action === 'delete-project-task') {
          const p = state.projects.find(pr => pr.id === actionEl.dataset.pid);
          if (p) p.tasks = p.tasks.filter(t => t.id !== actionEl.dataset.tid);
          saveState(); render();
        } else if (action === 'set-study-month') {
          state.studyMonthFilter = actionEl.dataset.month;
          saveState(); render();
        } else if (action === 'delete-study-block') {
          state.studyPlan = state.studyPlan.filter(b => b.id !== actionEl.dataset.id);
          saveState(); render();
        } else if (action === 'toggle-study-chapter') {
          const b = state.studyPlan.find(bl => bl.id === actionEl.dataset.bid);
          if (b) {
            const ch = b.chapters.find(c => c.id === actionEl.dataset.cid);
            if (ch) ch.done = !ch.done;
          }
          saveState(); render();
        } else if (action === 'toggle-habit-draft-day') {
          const dIdx = Number(actionEl.dataset.day);
          const arr = state.habitDraftDays || [0, 1, 2, 3, 4, 5, 6];
          if (arr.includes(dIdx)) {
            if (arr.length > 1) state.habitDraftDays = arr.filter(d => d !== dIdx);
            else showToast('Pick at least 1 day');
          } else {
            state.habitDraftDays = [...arr, dIdx];
          }
          saveState(); render();
        } else if (action === 'toggle-habit-day') {
          const h = state.habits.find(hb => hb.id === actionEl.dataset.id);
          if (h) {
            const dt = actionEl.dataset.date;
            if (h.history[dt]) delete h.history[dt];
            else h.history[dt] = true;
          }
          saveState(); render();
        } else if (action === 'delete-habit') {
          state.habits = state.habits.filter(h => h.id !== actionEl.dataset.id);
          saveState(); render();
        } else if (action === 'select-cal-date') {
          state.calSelectedDate = actionEl.dataset.date;
          saveState(); render();
        } else if (action === 'cal-prev') {
          if (state.calMonth === 0) { state.calMonth = 11; state.calYear--; }
          else state.calMonth--;
          saveState(); render();
        } else if (action === 'cal-next') {
          if (state.calMonth === 11) { state.calMonth = 0; state.calYear++; }
          else state.calMonth++;
          saveState(); render();
        } else if (action === 'cal-today') {
          const now = new Date();
          state.calYear = now.getFullYear();
          state.calMonth = now.getMonth();
          state.calSelectedDate = getTodayStr(0);
          saveState(); render();
        } else if (action === 'delete-cal-event') {
          state.calendarEvents = (state.calendarEvents || []).filter(ev => ev.id !== actionEl.dataset.id);
          saveState(); render();
        }
      });

      appRoot.addEventListener('change', (e) => {
        const el = e.target;
        if (el.id === 'toggle-carry-over') {
          state.carryOverUnfinished = el.checked;
          saveState();
          return;
        }
        const action = el.dataset.action;
        if (action === 'toggle-daily') {
          const t = state.dailyTasks.find(item => item.id === el.dataset.id);
          if (t) t.done = el.checked;
          saveState(); render();
        } else if (action === 'toggle-exercise') {
          const day = state.workoutSplit.find(d => d.id === el.dataset.day);
          const ex = day && day.exercises.find(x => x.id === el.dataset.id);
          if (ex) ex.done = el.checked;
          saveState(); render();
        } else if (action === 'edit-ex') {
          const day = state.workoutSplit.find(d => d.id === el.dataset.day);
          const ex = day && day.exercises.find(x => x.id === el.dataset.id);
          if (ex) ex[el.dataset.field] = el.value;
          saveState();
        } else if (action === 'change-project-status') {
          const p = state.projects.find(pr => pr.id === el.dataset.id);
          if (p) p.status = el.value;
          saveState(); render();
        } else if (action === 'toggle-project-task') {
          const p = state.projects.find(pr => pr.id === el.dataset.pid);
          const t = p && p.tasks.find(tk => tk.id === el.dataset.tid);
          if (t) t.done = el.checked;
          saveState(); render();
        } else if (action === 'edit-project-task-due') {
          const p = state.projects.find(pr => pr.id === el.dataset.pid);
          const t = p && p.tasks.find(tk => tk.id === el.dataset.tid);
          if (t) t.due = el.value;
          saveState(); render();
          showToast('Task target date updated');
        }
      });

      appRoot.addEventListener('input', (e) => {
        if (e.target.id === 'quick-scratchpad') {
          state.scratchpad = e.target.value;
          saveState();
        } else if (e.target.id === 'notes-search-input') {
          state.notesSearch = e.target.value;
          saveState();
          render();
          const inp = document.getElementById('notes-search-input');
          if (inp) {
            inp.focus();
            inp.setSelectionRange(inp.value.length, inp.value.length);
          }
        }
      });

      appRoot.addEventListener('submit', (e) => {
        e.preventDefault();
        const form = e.target;

        if (form.id === 'today-add-task-form') {
          const input = document.getElementById('today-task-input');
          const text = input.value.trim();
          if (!text) return;
          state.dailyTasks.unshift({ id: uid(), text, done: false, recurring: false, priority: 'normal' });
          saveState(); render();
        } else if (form.id === 'daily-add-form') {
          const text = document.getElementById('daily-input-text').value.trim();
          if (!text) return;
          const priority = document.getElementById('daily-input-priority').value;
          const recurring = document.getElementById('daily-input-recurring').checked;
          state.dailyTasks.unshift({ id: uid(), text, done: false, recurring, priority });
          saveState(); render();
        } else if (form.id === 'note-add-form') {
          const title = document.getElementById('note-title-input').value.trim();
          const body = document.getElementById('note-body-input').value.trim();
          const tag = document.getElementById('note-tag-input').value;
          if (!body) return;
          state.notes.unshift({ id: uid(), title: title || 'Quick Note', body, tag, pinned: false, updatedAt: 'Today' });
          saveState(); render();
          showToast('Note saved');
        } else if (form.id === 'add-workout-day-form') {
          const name = document.getElementById('new-workout-day-name').value.trim();
          if (!name) return;
          const newId = 'w-' + uid();
          state.workoutSplit.push({ id: newId, name, exercises: [] });
          state.workoutActiveDayId = newId;
          state.showAddWorkoutDay = false;
          saveState(); render();
          showToast('Workout day added');
        } else if (form.id === 'add-exercise-form') {
          const day = state.workoutSplit.find(d => d.id === form.dataset.day);
          if (!day) return;
          const name = document.getElementById('ex-name-input').value.trim();
          const sets = Number(document.getElementById('ex-sets-input').value) || 3;
          const reps = document.getElementById('ex-reps-input').value.trim() || '10';
          const weight = document.getElementById('ex-weight-input').value.trim() || '0';
          if (!name) return;
          day.exercises.push({ id: uid(), name, sets, reps, weight, done: false });
          saveState(); render();
        } else if (form.id === 'project-add-form') {
          const title = document.getElementById('project-title-input').value.trim();
          const due = document.getElementById('project-due-input').value.trim();
          if (!title) return;
          state.projects.unshift({ id: uid(), title, status: 'Active', due, tasks: [] });
          saveState(); render();
        } else if (form.dataset.action === 'add-project-task') {
          const p = state.projects.find(pr => pr.id === form.dataset.pid);
          const text = form.querySelector('input[name="taskText"]').value.trim();
          const due = form.querySelector('input[name="taskDue"]').value;
          if (!p || !text) return;
          p.tasks.push({ id: uid(), text, done: false, due });
          saveState(); render();
        } else if (form.id === 'study-add-form') {
          const month = Number(document.getElementById('study-month-input').value) || 1;
          const weekRange = document.getElementById('study-week-input').value.trim();
          const subject = document.getElementById('study-subject-input').value.trim();
          const rawChapters = document.getElementById('study-chapters-input').value.split(',').map(s => s.trim()).filter(Boolean);
          if (!weekRange || !subject || rawChapters.length === 0) return;
          state.studyPlan.push({
            id: uid(),
            month,
            weekRange,
            subject,
            chapters: rawChapters.map(label => ({ id: uid(), label, done: false }))
          });
          state.studyPlan.sort((a, b) => a.month - b.month);
          saveState(); render();
          showToast('Study block added');
        } else if (form.id === 'habit-add-form') {
          const emoji = document.getElementById('habit-emoji-input').value.trim() || '✅';
          const name = document.getElementById('habit-name-input').value.trim();
          if (!name) return;
          const scheduledDays = (state.habitDraftDays && state.habitDraftDays.length) ? [...state.habitDraftDays] : [0, 1, 2, 3, 4, 5, 6];
          state.habits.push({ id: uid(), name, emoji, scheduledDays, history: {} });
          saveState(); render();
          showToast('Habit added');
        } else if (form.id === 'cal-add-event-form') {
          const title = document.getElementById('cal-event-title').value.trim();
          const type = document.getElementById('cal-event-type').value;
          if (!title) return;
          if (!state.calendarEvents) state.calendarEvents = [];
          state.calendarEvents.push({ id: 'ce-' + uid(), date: state.calSelectedDate, title, type });
          saveState(); render();
          showToast('Date marked on Calendar');
        }
      });

      runDailyRefreshCheck(false);
      render();
      syncOfflineNotifications();
    })();
  </script>
</body>
</html>
